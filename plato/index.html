<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pasapalabra · Plató 3D</title>
<link rel="stylesheet" href="../assets/app.css"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#020a2a;font-family:'Arial Black',Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
#c{position:fixed;top:0;left:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none}
#hud>*{pointer-events:auto}
button{font-family:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
.sub{position:absolute;left:50%;bottom:4%;-webkit-transform:translateX(-50%);transform:translateX(-50%);max-width:88%;background:#000b;border-left:5px solid #ffd23a;border-radius:10px;padding:8px 14px;font:600 clamp(14px,2.4vw,24px) system-ui,Arial;text-shadow:0 1px 3px #000;display:none;pointer-events:none;color:#fff}
.sub b{color:#ffd23a}
.rot{position:absolute;left:3%;top:4%;font:900 clamp(16px,3vw,34px) system-ui,Arial;color:#29e6ff;text-shadow:0 0 16px #29e6ff;letter-spacing:2px;pointer-events:none;text-transform:uppercase}
.barra{position:absolute;right:1.5%;bottom:1.5%;display:-webkit-flex;display:flex;gap:6px;z-index:20}
.barra button{padding:8px 12px;border-radius:10px;border:2px solid #ffd23a;background:#000a;color:#fff;font:bold 14px system-ui,Arial;cursor:pointer;margin-left:6px}
.marc{position:absolute;right:2%;top:3%;background:#000a;border:2px solid #ffd23a;border-radius:12px;padding:6px 12px;font:900 clamp(13px,2.2vw,22px) system-ui,Arial;color:#ffd23a;pointer-events:none;white-space:nowrap}
.marc span{margin:0 6px}.marc .az{color:#7fd8ff}.marc .na{color:#ffb060}.marc b{color:#fff;margin:0 6px}
.panel{position:absolute;right:2%;top:13%;width:46%;max-height:68%;overflow:auto;background:linear-gradient(#0a1a5aee,#05081aee);border:3px solid #29e6ff;border-radius:16px;padding:10px 16px;box-shadow:0 0 30px #29e6ff88;color:#fff;box-sizing:border-box;font:800 clamp(14px,2vw,20px) system-ui,Arial}
.q{font-size:16px;text-align:center;margin:4px 0 8px}.def{font:700 15px Arial;text-align:center}.ltr{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:50%;background:#ff8a1c;color:#fff}
.estr{text-align:center;font-size:22px;letter-spacing:4px;margin:6px 0}.res{font:700 14px Arial;text-align:center}
.ops{text-align:center}.op{width:46%;margin:4px 1%;padding:9px 6px!important;font-size:clamp(12px,1.7vw,15px)!important}.op.okb,.dw.okb{background:linear-gradient(#5fe07a,#1a9a3a)!important}.op.kob,.dw.kob{background:linear-gradient(#ff7a7a,#c01a1a)!important}
.kbw{background:#000a;border-radius:10px;padding:5px}.inrow{display:-webkit-flex;display:flex;background:#fff;border-radius:20px;padding:3px;margin-bottom:4px}
.kin{color:#10204a;-webkit-flex:1;flex:1;font-size:18px;padding:4px 8px;min-height:22px}.kok,.kclr,.kpp{border-radius:16px;padding:4px 10px;color:#fff;margin-left:3px}.kok{background:#2e9bff}.kclr{background:#ff7aa0}.kpp{background:#ff8a1c;font-size:11px}
.krow{text-align:center;white-space:nowrap}.key{width:9.2%;height:30px;margin:2px .2%!important;padding:0!important;min-width:0!important;font-size:13px!important}
.sgrid{width:230px;margin:0 auto}.cell{width:40px;height:40px;margin:3px;border-radius:8px;background:#14328cd9;border:2px solid #5f8fdf;color:#fff;font-size:17px}.cell.sel{background:#ffd23a}.cell.found{background:#3dbb2b;color:#fff}
.dgrid{text-align:center}.dw{width:30%;margin:3px 1%!important;padding:10px 2px!important;font-size:12px!important;min-width:0!important}
.crono{position:absolute;left:3%;top:12%;width:70px;height:70px;line-height:70px;text-align:center;border-radius:50%;background:#1f7bff;border:4px solid #fff;font-size:26px}
.rhud{position:absolute;left:2%;top:12%;width:250px;height:250px;pointer-events:none}.rl{position:absolute;width:24px;height:24px;margin:-12px;line-height:24px;text-align:center;border-radius:50%;background:#1f7bff;border:2px solid #fff;font-size:12px}
.rl.o{background:#3dbb2b}.rl.k{background:#e8352f}.rl.c{background:#ff8a1c;-webkit-transform:scale(1.3);transform:scale(1.3)}
.rt{position:absolute;left:30%;right:30%;top:36%;text-align:center}.rt b{display:block;font-size:40px}.rt small{font:700 12px Arial}.rt.az b{color:#7fd8ff}.rt.na b{color:#ffb060}
.start{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle,#2b8cff,#03205f);text-align:center;padding-top:14vh;cursor:pointer}
.logo3d{font-size:60px;letter-spacing:-1px;text-shadow:0 4px 0 #0a3c9c}.start p{font:700 18px Arial}.start b{display:inline-block;margin-top:5vh}.start small{position:absolute;top:10px;right:14px;font-size:16px;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:12px}
.claqueta{position:absolute;top:40%;left:50%;-webkit-transform:translate(-50%,-50%);transform:translate(-50%,-50%);background:#111;border:4px solid #fff;padding:12px 24px;font-size:30px}
textarea{width:100%;box-sizing:border-box;font:15px Arial;border-radius:8px;border:2px solid #9fc4ff;padding:6px}.pitem{font:700 13px Arial;padding:6px;border-bottom:1px solid #cde;cursor:pointer}
#err{position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;background:#c00;color:#fff;font:12px monospace;padding:6px;z-index:99;white-space:pre-wrap;display:none}
@media (max-height:420px){.panel{top:9%;max-height:80%}.key{height:24px}.sub{font-size:14px}}
body.p3d .sub{background:linear-gradient(#3a72e0,#1745b4);border:3px solid #fff;outline:2px solid #fff;outline-offset:-8px;border-left:3px solid #fff;border-radius:0;text-align:center;font-weight:700;color:#fff;padding:12px 26px;box-shadow:0 4px 14px #0008}
body.p3d .panel{background:#2a5fd8;border:3px solid #fff;outline:2px solid #fff;outline-offset:-9px;border-radius:0}
body.p3d .op{background:#ee7a1c!important;border:2px solid #fff!important;border-radius:0!important;color:#fff!important;font-weight:900!important}
body.p3d .cell,body.p3d .dw{border-radius:0;background:#2a5fd8;border:2px solid #fff}
body.p3d .crono{background:#ee7a1c;border-color:#fff}
</style></head><body>
<canvas id="c"></canvas><div id="hud"></div><div id="err"></div>
<script>
window.PP_VERSION='1.2';
(function(){var e=document.getElementById('err');function show(m){e.style.display='block';e.textContent+=m+'\n';}
window.onerror=function(m,s,l){show('Error: '+m+' ('+(s||'').split('/').pop()+':'+l+')');};
window.addEventListener('unhandledrejection',function(ev){show('Promesa: '+(ev.reason&&ev.reason.message||ev.reason));});
try{var c=document.createElement('canvas');if(!(c.getContext('webgl')||c.getContext('experimental-webgl')))show('Este dispositivo no tiene WebGL: el plató 3D no puede mostrarse. Usa el modo Clásico 2D.');}catch(x){}})();
</script>
<script src="voz/index.js"></script>
<script src="../mc3d/mc3d.js"></script>
<script src="plato.js"></script>
</body></html>
